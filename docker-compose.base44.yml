services:
  web:
    image: node:22
    restart: on-failure
    working_dir: /app
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      # Platform-managed secrets (Telegram / CRM). Optional — the site runs without them.
      - path: /run/base44/app.env
        required: false
    ports:
      - "3000:3000"
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund
        exec npm run dev
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 120s

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.base44
    image: base44-jupyter:dev
    restart: on-failure
    working_dir: /work
    volumes:
      - .:/work
    ports:
      - "8888:8888"
    command:
      - sh
      - -ec
      - |
        exec jupyter lab --config=/work/.base44/jupyter_lab_config.py
    healthcheck:
      test: ["CMD", "sh", "-ec", "curl -fsS http://localhost:8888/api/status >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  web_node_modules:
